<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Book · Deutsch</title>
<meta name="theme-color" content="#24272e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memory Book">
<style>
:root{
  --bg:#f6f6f4; --card:#fff; --ink:#22242a; --muted:#6f727a; --line:#e3e3df; --soft:#efefeb;
  --accent:#24272e; --accent-ink:#fff; --warn:#fff4dc; --warn-line:#e7b54a; --danger:#c9443d;
  --der:#2f6fd6; --die:#d6423b; --das:#2f9a5a; --pre:#c76a00;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#16181c; --card:#20232a; --ink:#e9eaee; --muted:#9a9ea8; --line:#30343c; --soft:#2a2e36;
    --accent:#e9eaee; --accent-ink:#16181c; --warn:#3a3020; --warn-line:#a8812f;
    --der:#6d9cf0; --die:#f07a72; --das:#5cc48a; --pre:#f0a040; }
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.der{color:var(--der);font-weight:700}.die{color:var(--die);font-weight:700}.das{color:var(--das);font-weight:700}
.pre{color:var(--pre);font-weight:800}

/* Header */
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.wrap{max-width:820px;margin:0 auto}
.titlebar{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.titlebar h1{font-size:1.25rem;margin:0}
.titlebar .count{color:var(--muted);font-size:.88rem}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 40px 11px 14px;font-size:1rem;outline:none}
.search input:focus{border-color:var(--ink)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:1.2rem;color:var(--muted);cursor:pointer;width:32px;height:32px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.86rem;cursor:pointer;white-space:nowrap}
.chip small{color:var(--muted);margin-left:4px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on small{color:inherit;opacity:.7}
.tools{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 11px;font-size:.84rem;cursor:pointer}
.tbtn.on{border-color:var(--ink)}
.tools .legend{margin-left:auto;font-size:.8rem;color:var(--muted)}

/* Cards */
main{padding:16px 16px 110px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){ .grid{gap:8px} .card{height:118px} .face{padding:22px 6px 30px} .de{font-size:.86rem} .en{font-size:.82rem} .lab .lfull{display:none} .lab .lshort{display:inline} .note{font-size:.7rem} .lab{font-size:.56rem;left:7px;top:7px} .say{width:26px;height:26px;bottom:5px;right:5px;font-size:.7rem} .acts button{width:24px;height:24px;font-size:.8rem} }
.card{position:relative;height:132px;perspective:900px;cursor:pointer}
.inner{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.card.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;overflow:hidden;border-radius:var(--r);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 12px 12px;border:1px solid var(--line)}
.front{background:var(--card)}
.back{background:var(--soft);transform:rotateY(180deg)}
.de{font-size:1.08rem;font-weight:600;line-height:1.3;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;max-width:100%}
.lshort{display:none}
.en{font-size:1rem;line-height:1.3}
.note{font-size:.78rem;color:var(--muted);margin-top:6px}
.lab{position:absolute;top:8px;left:10px;font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mine-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pre);margin-right:5px;vertical-align:middle}
.say{position:absolute;bottom:8px;right:8px;border:0;background:var(--soft);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:.8rem}
.back .say{background:var(--card)}
.acts{position:absolute;top:4px;right:4px;display:flex;gap:2px;z-index:2}
.acts button{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:.9rem}
.acts button:hover{background:var(--soft);color:var(--ink)}
.card.on .acts{display:none}
.card.flash .front{box-shadow:0 0 0 3px var(--pre)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* Add button */
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:20;width:60px;height:60px;border-radius:50%;border:0;
  background:var(--accent);color:var(--accent-ink);font-size:2rem;line-height:1;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* Sheet */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
@media (min-width:700px){ .overlay{align-items:center} .sheet{border-radius:18px} }
.sheet h2{margin:0 0 14px;font-size:1.15rem;display:flex;align-items:center}
.sheet h2 .x{margin-left:auto;border:0;background:none;font-size:1.4rem;cursor:pointer;color:var(--muted)}
.field{margin-bottom:12px}
.field label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.field input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:1rem;outline:none}
.field input:focus{border-color:var(--ink)}
.letters{display:flex;gap:6px;margin:-4px 0 12px}
.letters button{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:38px;height:34px;cursor:pointer;font-weight:700}
.labels{display:flex;flex-wrap:wrap;gap:6px}
.labels .chip{background:var(--bg)}
.labels .chip.on{background:var(--accent)}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.dup{background:var(--warn);border:1px solid var(--warn-line);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:4px 0 12px}
.dup ul{margin:6px 0 0;padding-left:18px}
.dup .choice{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row{display:flex;gap:8px;margin-top:6px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.danger{background:none;color:var(--danger);margin-right:auto;padding-left:0}
.btn.sm{padding:7px 12px;font-size:.88rem}
.row .btn.main{flex:1}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--accent);color:var(--accent-ink);
  padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:40}
#toast.on{opacity:1;transform:translateX(-50%)}
#voiceMsg{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:var(--warn);border:1px solid var(--warn-line);color:var(--ink);
  border-radius:12px;padding:12px 14px;font-size:.9rem;z-index:41;box-shadow:0 6px 20px rgba(0,0,0,.15)}
select.tbtn{max-width:220px;background:var(--card)}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="titlebar"><h1>Memory Book</h1><span class="count" id="count"></span></div>
  <div class="search">
    <input id="q" type="search" placeholder="Search in German or English" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="clear" id="qclear" hidden aria-label="Clear search">×</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="tools">
    <button class="tbtn" id="mineBtn">Only my words</button>
    <button class="tbtn" id="dirBtn"></button>
    <button class="tbtn" id="resetBtn">Turn all back</button>
    <select class="tbtn" id="voiceSel" hidden aria-label="German voice"></select>
    <button class="tbtn" id="voiceHelp" hidden>🔇 No German voice</button>
    <span class="legend"><span class="der">der</span> · <span class="die">die</span> · <span class="das">das</span> · <span class="pre">prefix</span></span>
  </div>
</div></header>

<main><div class="wrap">
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No word found.</p>
</div></main>

<button class="fab" id="fab" aria-label="Add a word">+</button>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2><span id="sheetTitle">Add a word</span><button class="x" id="closeBtn" aria-label="Close">×</button></h2>
    <div class="field"><label for="f-de">German</label>
      <input id="f-de" placeholder="der Hund · ab|holen" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div class="letters" id="letters"></div>
    <div id="dupBox"></div>
    <div class="field"><label for="f-en">English</label>
      <input id="f-en" placeholder="dog · to pick up" autocomplete="off"></div>
    <div class="field"><label for="f-note">Note (optional)</label>
      <input id="f-note" placeholder="pl. die Hunde" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label>Word type</label><div class="labels" id="f-labels"></div>
      <div class="hint">For nouns, write the article (der / die / das). For separable verbs, mark the prefix with | (an|rufen).</div></div>
    <div class="dup" id="delConfirm" hidden>Delete this word from your Memory Book?
      <div class="choice"><button class="btn sm" id="delYes" style="background:var(--danger);color:#fff">Delete</button><button class="btn sm alt" id="delNo">Keep it</button></div></div>
    <p style="margin:0 0 8px"><button class="btn sm alt" id="resetWordBtn" hidden>Restore the original word</button></p>
    <div class="row">
      <button class="btn danger" id="delBtn" hidden>Delete</button>
      <button class="btn alt" id="cancelBtn">Cancel</button>
      <button class="btn main" id="saveBtn">Add</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="voiceMsg" hidden role="alert"></div>

const KEY = "deutsch_macht_spass_v2";   // same storage as the previous app, so saved words are kept
const S = (()=>{ let d={}; try{ d=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){} return d; })();
if(!Array.isArray(S.myWords)) S.myWords = [];   // rows: [german, english, note, oldCategory, label]
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Could not save on this device"); } }

/* ---------------- Text helpers ---------------- */
const escH = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const ARTICLE = /^(der|die|das|den|dem|des|ein|eine|einen)\s+/i;
function fold(s, umlautAsE){
  s = String(s||"").toLowerCase().replace(/\|/g,"").replace(/ß/g,"ss");
  s = umlautAsE ? s.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
                : s.replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u");
  return s.replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
}
const deKey = de => fold(String(de).trim().replace(ARTICLE,""), true);
const enKey = en => fold(String(en).trim().replace(/^to\s+/i,""), false);
function deHTML(de){
  let h = escH(de).replace(/^(der|die|das)\b/i, a=>`<span class="${a.toLowerCase()}">${a}</span>`);
  return h.replace(/(^|\s)([a-zäöüß]+)\|/gi, (m,sp,pre)=>`${sp}<span class="pre">${pre}</span>`);
}
const speakText = de => String(de)
  .replace(/\|/g,"")                        // ab|holen -> abholen
  .replace(/\+\s*(Dativ|Akkusativ|Genitiv|Nominativ)\b/gi,"")   // grammar tags are not spoken
  .replace(/[()]/g," ")                     // kommen (aus) -> kommen aus
  .replace(/\s*(↔|=|\/|;)\s*/g,", ")        // pairs and alternatives become a short pause
  .replace(/…|\.\.\./g,"")
  .replace(/\s+/g," ").replace(/^[,\s]+|[,\s]+$/g,"").trim();

/* ---------------- Automatic label for words saved before labels existed ---------------- */
const PRONOUNS = "ich du er sie es wir ihr mich dich ihn uns euch mir dir ihm ihnen man jemand niemand etwas nichts alles mein dein sein unser euer".split(" ");
const PREPS = "in an auf aus bei mit nach von zu seit für gegen ohne um durch über unter vor hinter neben zwischen bis ab".split(" ");
const CONJ = "und oder aber denn sondern weil dass ob wenn als obwohl damit".split(" ");
function guessLabel(de, en, oldCat){
  const d = String(de).trim(), w = d.toLowerCase().replace(/\s*\(.*\)$/,"");
  if(/\|/.test(d)) return "Separable verb";
  if(/^(der|die|das)\s+\S+/i.test(d)) return "Noun";
  if(PRONOUNS.includes(w)) return "Pronoun";
  if(PREPS.includes(w.split(" ")[0]) && (w.split(" ").length===1 || /\+/.test(w))) return "Preposition";
  if(CONJ.includes(w)) return "Conjunction";
  if(/^to\s/i.test(String(en).trim()) || /^verb/i.test(oldCat||"")) return "Verb";
  if(/\s/.test(w)) return "Phrase";
  if(/^[a-zäöüß]+(en|ern|eln)$/.test(d)) return "Verb";
  if(/^[A-ZÄÖÜ]/.test(d)) return "Noun";
  return "Other";
}
let migrated = false;
const BASE_LABEL = {}; BASE.forEach(r=>String(r[0]).split(/\s*(?:↔|\/|,)\s*/).concat(r[0]).forEach(p=>{ const k=deKey(p); if(k && !BASE_LABEL[k]) BASE_LABEL[k]=r[3]; }));
S.myWords.forEach(r=>{ if(!LABELS.includes(r[4])){ r[4] = BASE_LABEL[deKey(r[0])] || guessLabel(r[0], r[1], r[3]); migrated = true; } });
if(migrated) save();

/* ---------------- Index of all words ---------------- */
let ALL = [];
function buildIndex(){
  ALL = BASE.map((r,i)=>{ if(S.baseDel.includes(i)) return null; const e=S.baseEdit[i]||r; return {de:e[0], en:e[1], note:e[2]||"", label:e[3], mine:false, id:"b"+i}; }).filter(Boolean)
    .concat(S.myWords.map((r,i)=>({de:r[0], en:r[1], note:r[2]||"", label:r[4], mine:true, id:"m"+i, idx:i})));
  ALL.forEach(w=>{ w.k = deKey(w.de); w.kA = fold(w.de.replace(ARTICLE,""), false); w.e = enKey(w.en);
    w.keys = [w.k, ...String(w.de).split(/\s*(?:↔|\/|,)\s*/).map(deKey)].filter(Boolean); });
  ALL.sort((a,b)=> a.kA.localeCompare(b.kA) || a.de.localeCompare(b.de));
}

/* ---------------- View state ---------------- */
let curLabel = "", onlyMine = false, flashId = null;

function cardHTML(w){
  const deSide = `<div class="de" lang="de">${deHTML(w.de)}</div>`;
  const enSide = `<div class="en">${escH(w.en)}</div>${w.note?`<div class="note">${escH(w.note)}</div>`:""}`;
  const [f,b] = S.mbRev ? [enSide, deSide] : [deSide, enSide];
  const lab = `<span class="lab">${w.mine?'<span class="mine-dot"></span>':""}<span class="lfull">${escH(w.label)}</span><span class="lshort">${escH(SHORT[w.label]||w.label)}</span></span>`;
  const say = `<button class="say" data-say="${escH(speakText(w.de))}" aria-label="Listen">🔊</button>`;
  const acts = `<div class="acts"><button data-edit="${w.id}" aria-label="Edit">✎</button></div>`;
  return `<div class="card${w.id===flashId?' flash':''}" data-id="${w.id}">${acts}<div class="inner">
    <div class="face front">${lab}${f}${say}</div><div class="face back">${lab}${b}${say}</div></div></div>`;
}
function matches(w, q){
  if(curLabel && w.label!==curLabel) return false;
  if(onlyMine && !w.mine) return false;
  if(!q) return true;
  const qE = fold(q.replace(ARTICLE,"").replace(/^to\s+/i,""), true), qA = fold(q.replace(ARTICLE,"").replace(/^to\s+/i,""), false);
  return w.k.includes(qE) || w.kA.includes(qA) || w.e.includes(qA) || fold(w.en,false).includes(qA);
}
function render(){
  const q = document.getElementById("q").value.trim();
  document.getElementById("qclear").hidden = !q;
  const pool = ALL.filter(w=>(!onlyMine||w.mine));
  const counts = {}; pool.forEach(w=>counts[w.label]=(counts[w.label]||0)+1);
  document.getElementById("chips").innerHTML =
    `<button class="chip${curLabel?'':' on'}" data-label="">All<small>${pool.length}</small></button>` +
    LABELS.filter(l=>counts[l]).map(l=>`<button class="chip${curLabel===l?' on':''}" data-label="${l}">${l}<small>${counts[l]}</small></button>`).join("");
  if(curLabel && !counts[curLabel]) curLabel = "";
  let list = ALL.filter(w=>matches(w,q));
  if(q){ const qE=fold(q.replace(ARTICLE,"").replace(/^to\s+/i,""),true), qA=fold(q.replace(ARTICLE,"").replace(/^to\s+/i,""),false);
    const rank = w => (w.keys.includes(qE)||w.e===qA) ? 0 : (w.k.startsWith(qE)||w.kA.startsWith(qA)||w.e.startsWith(qA)) ? 1 : 2;
    list = list.map((w,i)=>[rank(w),i,w]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(x=>x[2]); }
  document.getElementById("grid").innerHTML = list.map(cardHTML).join("");
  document.getElementById("empty").hidden = list.length>0;
  const mine = S.myWords.length;
  document.getElementById("count").textContent = `${ALL.length} words · ${mine} mine`;
  document.getElementById("mineBtn").classList.toggle("on", onlyMine);
  document.getElementById("dirBtn").textContent = S.mbRev ? "English first" : "German first";
}

/* ---------------- Audio: German voice only ---------------- */
const HAS_TTS = "speechSynthesis" in window;
let deVoices = [], deVoice = null;
function voiceScore(v){
  let sc = 0;
  if(/^de[-_]DE$/i.test(v.lang)) sc += 40; else if(/^de[-_](AT|CH)$/i.test(v.lang)) sc += 25; else if(/^de\b/i.test(v.lang)) sc += 20;
  if(/natural|neural|premium|enhanced|wavenet/i.test(v.name)) sc += 30;
  if(/google/i.test(v.name)) sc += 20;
  if(/katja|conrad|amala|killian|seraphina|florian|anna|helena|petra|markus|yannick/i.test(v.name)) sc += 10;
  if(v.localService) sc += 5;
  return sc;
}
function loadVoices(){
  if(!HAS_TTS) return;
  deVoices = speechSynthesis.getVoices().filter(v=>/^de\b|^de[-_]/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));
  deVoice = deVoices.find(v=>v.name===S.voiceName) || deVoices[0] || null;
  renderVoiceSel();
}
function renderVoiceSel(){
  const sel = document.getElementById("voiceSel"); if(!sel) return;
  if(!HAS_TTS || !deVoices.length){ sel.hidden = true; document.getElementById("voiceHelp").hidden = false; return; }
  document.getElementById("voiceHelp").hidden = true; sel.hidden = false;
  sel.innerHTML = deVoices.map(v=>`<option value="${escH(v.name)}"${deVoice&&v.name===deVoice.name?" selected":""}>🔊 ${escH(v.name.replace(/^(Microsoft|Google)\s+/,""))} (${escH(v.lang)})</option>`).join("");
}
if(HAS_TTS){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; setTimeout(loadVoices, 500); setTimeout(loadVoices, 2000); }
function voiceHelpText(){
  const ua = navigator.userAgent;
  if(/Android/i.test(ua)) return "No German voice on this phone. Open Settings → System → Languages → Text-to-speech output → Google (⚙) → Install voice data → Deutsch (Deutschland). Then reopen the app.";
  if(/iPhone|iPad|iPod/i.test(ua)) return "No German voice on this device. Open Settings → Accessibility → Spoken Content → Voices → German, and download a voice (for example Anna, Enhanced). Then reopen the app.";
  if(/Windows/i.test(ua)) return "No German voice found. Use Chrome or Edge with internet, or add one: Settings → Time & language → Speech → Add voices → Deutsch.";
  if(/Mac/i.test(ua)) return "No German voice found. Open System Settings → Accessibility → Spoken Content → System voice → Manage voices → German.";
  return "No German voice found on this device. Install a German text-to-speech voice in your system settings.";
}
function speak(t){
  if(!HAS_TTS){ toast("Audio is not available in this browser"); return; }
  if(!deVoice) loadVoices();
  if(!deVoice){ alertBox(voiceHelpText()); return; }    // never read German with a French or English voice
  speechSynthesis.cancel();
  setTimeout(()=>{
    const u = new SpeechSynthesisUtterance(t);
    u.voice = deVoice; u.lang = deVoice.lang; u.rate = .85; u.pitch = 1;
    u.onerror = e=>{ if(e.error!=="interrupted" && e.error!=="canceled") toast(deVoice.localService ? "Audio error, try again" : "This voice needs internet. Choose another German voice."); };
    speechSynthesis.speak(u);
  }, 60);
}
function alertBox(msg){
  const b = document.getElementById("voiceMsg"); b.textContent = msg; b.hidden = false;
  clearTimeout(alertBox.t); alertBox.t = setTimeout(()=>b.hidden=true, 12000);
}

/* ---------------- Toast ---------------- */
let tT; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove("on"),1800); }

/* ---------------- Add / edit sheet ---------------- */
let editId = null, curFormLabel = "", dupAccepted = false;   // editId: "b12" (built-in word) or "m3" (my word)
const $ = id => document.getElementById(id);
if(!S.baseEdit || typeof S.baseEdit!=="object") S.baseEdit = {};   // edited built-in words: index -> [de,en,note,label]
if(!Array.isArray(S.baseDel)) S.baseDel = [];                        // deleted built-in words: indexes
function rowOf(id){
  const i = +id.slice(1);
  if(id[0]==="m"){ const r=S.myWords[i]; return r && [r[0],r[1],r[2]||"",r[4]]; }
  return S.baseEdit[i] || BASE[i];
}
function renderFormLabels(){
  $("f-labels").innerHTML = LABELS.map(l=>`<button type="button" class="chip${curFormLabel===l?' on':''}" data-flabel="${l}">${l}</button>`).join("");
}
function openSheet(id){
  editId = id || null; dupAccepted = false;
  const r = editId ? rowOf(editId) : ["","","",""];
  $("f-de").value = r[0]; $("f-en").value = r[1]; $("f-note").value = r[2]||"";
  curFormLabel = editId ? r[3] : "";
  $("sheetTitle").textContent = editId ? "Edit word" : "Add a word";
  $("saveBtn").textContent = editId ? "Save" : "Add";
  $("delBtn").hidden = !editId;
  $("resetWordBtn").hidden = !(editId && editId[0]==="b" && S.baseEdit[+editId.slice(1)]);
  renderFormLabels(); $("dupBox").innerHTML = "";
  $("overlay").hidden = false;
  setTimeout(()=>$("f-de").focus(), 60);
  if(editId) checkDup(false);
}
function closeSheet(){ $("overlay").hidden = true; editId = null; $("delConfirm").hidden = true; }
function findDups(de){
  const k = deKey(de); if(!k) return [];
  return ALL.filter(w=>w.keys.includes(k) && w.id!==editId);
}
function dupList(d){ return `<ul>${d.map(w=>`<li>${deHTML(w.de)} — ${escH(w.en)} <span style="color:var(--muted)">(${escH(w.label)}${w.mine?", my word":", built-in"})</span></li>`).join("")}</ul>`; }
function checkDup(strong){
  const d = findDups($("f-de").value);
  if(!d.length){ $("dupBox").innerHTML = ""; return d; }
  $("dupBox").innerHTML = `<div class="dup"><b>Already in your Memory Book:</b>${dupList(d)}
    ${strong ? `<div class="choice">
      <button class="btn sm" id="dupAdd">${editId?"Save anyway":"Add anyway"}</button>
      ${!editId ? `<button class="btn sm alt" id="dupEdit" data-id="${d[0].id}">Edit the existing one</button>`:""}
      <button class="btn sm alt" id="dupCancel">Cancel</button></div>` : ""}</div>`;
  return d;
}
function insertCh(ch){
  const inp = (lastInput && document.body.contains(lastInput)) ? lastInput : $("f-de");
  const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? inp.value.length;
  inp.value = inp.value.slice(0,s)+ch+inp.value.slice(e); inp.focus(); inp.setSelectionRange(s+1,s+1);
  if(inp.id==="f-de"){ dupAccepted=false; checkDup(false); }
}
let lastInput = null;
function afterChange(id, msg){
  save(); buildIndex(); closeSheet();
  flashId = id;
  const target = ALL.find(w=>w.id===flashId);
  if(target && !matches(target, $("q").value.trim())){ $("q").value=""; curLabel=""; onlyMine=false; }
  render();
  const el = document.querySelector(`.card[data-id="${flashId}"]`); if(el) el.scrollIntoView({block:"center",behavior:"smooth"});
  setTimeout(()=>{ flashId=null; const c=document.querySelector(".card.flash"); if(c) c.classList.remove("flash"); }, 2500);
  toast(msg);
}
function saveWord(){
  const de = $("f-de").value.trim(), en = $("f-en").value.trim(), note = $("f-note").value.trim();
  if(!de){ toast("Write the German word"); $("f-de").focus(); return; }
  if(!en){ toast("Write the English translation"); $("f-en").focus(); return; }
  if(!curFormLabel){ toast("Choose the word type"); $("f-labels").scrollIntoView({block:"center",behavior:"smooth"}); return; }
  if(!dupAccepted && findDups(de).length){ checkDup(true); $("dupBox").scrollIntoView({block:"center",behavior:"smooth"}); return; }
  if(editId && editId[0]==="b"){ S.baseEdit[+editId.slice(1)] = [de,en,note,curFormLabel]; afterChange(editId, "Word updated"); return; }
  if(editId){ const i=+editId.slice(1), old=S.myWords[i]; S.myWords[i]=[de,en,note,old[3]||"",curFormLabel]; afterChange(editId, "Word updated"); return; }
  S.myWords.push([de,en,note,"",curFormLabel]); afterChange("m"+(S.myWords.length-1), "Word added");
}
function deleteWord(){
  if(!editId) return;
  if($("delConfirm").hidden){ $("delConfirm").hidden = false; $("delConfirm").scrollIntoView({block:"center",behavior:"smooth"}); return; }
  const i = +editId.slice(1);
  if(editId[0]==="b"){ if(!S.baseDel.includes(i)) S.baseDel.push(i); delete S.baseEdit[i]; }
  else S.myWords.splice(i,1);
  save(); buildIndex(); closeSheet(); render(); toast("Word deleted");
}
function resetBaseWord(){
  if(!editId || editId[0]!=="b") return;
  const id = editId; delete S.baseEdit[+id.slice(1)]; afterChange(id, "Original word restored");
}

$("qclear").onclick = ()=>{ $("q").value=""; render(); $("q").focus(); };
$("mineBtn").onclick = ()=>{ onlyMine=!onlyMine; render(); };
$("dirBtn").onclick = ()=>{ S.mbRev=!S.mbRev; save(); render(); };
$("voiceSel").onchange = e=>{ S.voiceName = e.target.value; save(); loadVoices(); speak("Guten Tag! Ich spreche Deutsch."); };
$("voiceHelp").onclick = ()=>alertBox(voiceHelpText());
$("voiceMsg").onclick = ()=>$("voiceMsg").hidden = true;
$("resetBtn").onclick = ()=>document.querySelectorAll(".card.on").forEach(c=>c.classList.remove("on"));
$("fab").onclick = ()=>openSheet(null);
$("closeBtn").onclick = $("cancelBtn").onclick = closeSheet;
$("saveBtn").onclick = saveWord;
$("delBtn").onclick = deleteWord;
$("delYes").onclick = deleteWord;
$("delNo").onclick = ()=>$("delConfirm").hidden = true;
$("resetWordBtn").onclick = resetBaseWord;
$("overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeSheet(); });
["f-de","f-en","f-note"].forEach(id=>{
  $(id).addEventListener("focus", e=>lastInput=e.target);
  $(id).addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); id==="f-de"?$("f-en").focus():saveWord(); } });
});
$("f-de").addEventListener("input", ()=>{ dupAccepted=false; checkDup(false); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("overlay").hidden) closeSheet(); });
document.addEventListener("click", e=>{
  const t = e.target;
  const say = t.closest(".say"); if(say){ e.stopPropagation(); speak(say.dataset.say); return; }
  const ed = t.closest("[data-edit]"); if(ed){ e.stopPropagation(); openSheet(ed.dataset.edit); return; }
  const ch = t.closest("[data-ch]"); if(ch){ e.preventDefault(); insertCh(ch.dataset.ch); return; }
  const fl = t.closest("[data-flabel]"); if(fl){ curFormLabel=fl.dataset.flabel; renderFormLabels(); return; }
  const lb = t.closest("[data-label]"); if(lb){ curLabel=lb.dataset.label; render(); return; }
  if(t.id==="dupAdd"){ dupAccepted=true; saveWord(); return; }
  if(t.id==="dupEdit"){ openSheet(t.dataset.id); return; }
  if(t.id==="dupCancel"){ closeSheet(); return; }
  const card = t.closest(".card"); if(card) card.classList.toggle("on");
});
document.addEventListener("mousedown", e=>{ if(e.target.closest("[data-ch]")) e.preventDefault(); });

buildIndex(); render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
